name: external-agent-review-s04

on:
  workflow_dispatch:
  push:
    paths:
      - "TRACE/portero.jsonl"
      - "activity/policy.json"
      - "activity/requests.json"
      - "prompts/trace_review.md"
      - "schemas/trace_review.json"
      - "scripts/run_external_review.py"
      - ".github/workflows/external-review.yml"

permissions:
  contents: write

jobs:
  cross-review:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      AUDIT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate S04 before peer exchange
        run: python scripts/validate_submission.py --pre-review
      - name: Verify Gemini credential
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Falta GEMINI_API_KEY en Actions secrets."
            exit 1
          fi
      - name: Run Gemini cross review
        run: python scripts/run_external_review.py
      - name: Validate final state generated by review
        run: python scripts/validate_submission.py
      - name: Commit immutable cross-review evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ bitacora.md
          if git diff --cached --quiet; then
            echo "No hay evidencia nueva que guardar."
            exit 0
          fi
          git commit -m "Registra auditoría cruzada Gemini S04 run ${GITHUB_RUN_ID}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
