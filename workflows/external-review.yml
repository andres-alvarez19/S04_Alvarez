name: external-agent-review

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      AUDIT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate submission before external review
        run: python scripts/validate_submission.py

      - name: Verify Gemini credential
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Falta el secret GEMINI_API_KEY en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run external adversarial review
        run: python scripts/run_external_review.py

      - name: Commit immutable audit trail
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/
          if git diff --cached --quiet; then
            echo "No hay cambios de auditoría para guardar."
            exit 0
          fi
          git commit -m "Registra revisión externa Gemini run ${GITHUB_RUN_ID}"
          git push
